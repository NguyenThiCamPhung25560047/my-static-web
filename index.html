<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Web App & Mini Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell {
            transition: all 0.2s ease-in-out;
        }
        .cell:hover {
            background-color: #fef3c7;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-yellow-200 via-rose-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 border-4 border-amber-500 text-center space-y-5 relative">
        
        <!-- Badge -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-100 border-2 border-amber-500 text-amber-800 text-xs font-black tracking-wide">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
            CIRCUS FORTUNE TIC-TAC-TOE 🎪
        </div>

        <!-- Header Section -->
        <div>
            <h1 class="text-4xl font-black bg-gradient-to-r from-red-500 via-amber-600 to-purple-600 bg-clip-text text-transparent">
                Hello World!
            </h1>
            <p class="text-slate-500 text-xs font-extrabold mt-1">Welcome to my interactive static web app.</p>
        </div>

        <!-- Student Info -->
        <div class="bg-amber-50/80 p-3 rounded-2xl text-xs flex justify-around border-2 border-dashed border-amber-500">
            <p><span class="text-amber-900 font-bold">Student:</span> <strong class="text-amber-700">Nguyen Thi Cam Phung</strong></p>
            <p><span class="text-amber-900 font-bold">ID:</span> <strong class="text-red-600 font-mono">25560047</strong></p>
        </div>

        <!-- Mini Game: Tic-Tac-Toe -->
        <div class="bg-amber-50 p-4 rounded-2xl border-2 border-yellow-300 shadow-inner">
            <h2 class="text-base font-black text-amber-800 mb-1">🎮 Play Tic-Tac-Toe</h2>
            <p id="status" class="text-xs text-red-600 mb-3 font-extrabold">Player X's turn</p>
            
            <!-- Game Board -->
            <div class="grid grid-cols-3 gap-2 max-w-[210px] mx-auto mb-3">
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 0)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 1)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 2)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 3)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 4)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 5)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 6)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 7)"></button>
                <button class="cell h-16 bg-white rounded-xl text-2xl font-black border-2 border-amber-400 shadow-sm" onclick="makeMove(this, 8)"></button>
            </div>

            <button onclick="resetGame()" class="px-4 py-2 text-xs bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 text-white rounded-xl font-black transition shadow-md active:scale-95">
                🔄 Restart Game
            </button>
        </div>

    </div>

    <!-- Game Logic JavaScript -->
    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function makeMove(button, index) {
            if (board[index] !== "" || !isGameActive) return;

            board[index] = currentPlayer;
            button.innerText = currentPlayer;
            button.classList.add(currentPlayer === "X" ? "text-red-500" : "text-purple-600");

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                document.getElementById("status").innerText = `🎉 Player ${currentPlayer} Wins!`;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("status").innerText = "🤝 It's a Draw!";
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.getElementById("status").innerText = `Player ${currentPlayer}'s turn`;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            document.getElementById("status").innerText = "Player X's turn";
            document.querySelectorAll(".cell").forEach(button => {
                button.innerText = "";
                button.classList.remove("text-red-500", "text-purple-600");
            });
        }
    </script>
</body>
</html>
